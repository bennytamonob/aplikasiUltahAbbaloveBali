<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlessingCard - Abbalove Ministries</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/YFNydDhq/logo.png">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2canvas -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: { // Tema Biru (Navy/Royal Blue)
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554',
                        },
                        accent: { // Tema Merah (Crimson/Ruby)
                            50: '#fef2f2',
                            100: '#fee2e2',
                            400: '#f87171',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Premium Card Effects */
        .card-texture {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-accent-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- KONFIGURASI UTAMA ---
        const LINK_API_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxJsYbC3qlfzSdUJXMfjGTAJ6izeVdU7KPgpznKmGSCFVJfCvwqytewGwKLO1W9O09u/exec"; 
        const LINK_LOGO_DEFAULT = "https://i.ibb.co.com/YFNydDhq/logo.png"; 
        const FALLBACK_LOGO = "https://ui-avatars.com/api/?name=AM&background=1e3a8a&color=fff";
        // -------------------------

        // --- ICONS (Lucide Style) ---
        const Icon = ({ path, className = "w-5 h-5", fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );
        const Calendar = ({c}) => <Icon className={c} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></>} />;
        const Users = ({c}) => <Icon className={c} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></>} />;
        const RefreshCw = ({c}) => <Icon className={c} path={<><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></>} />;
        const Download = ({c}) => <Icon className={c} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></>} />;
        const MapPin = ({c}) => <Icon className={c} path={<><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></>} />;
        const LogOut = ({c}) => <Icon className={c} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></>} />;
        const X = ({c}) => <Icon className={c} path={<><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></>} />;
        const Plus = ({c}) => <Icon className={c} path={<><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></>} />;
        const Edit = ({c}) => <Icon className={c} path={<><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></>} />;
        const Trash2 = ({c}) => <Icon className={c} path={<><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></>} />;
        const Search = ({c}) => <Icon className={c} path={<><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></>} />;
        const Settings = ({c}) => <Icon className={c} path={<><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></>} />;
        const Gift = ({c}) => <Icon className={c} path={<><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></>} />;

        const CHRISTIAN_QUOTES = [
            "Kiranya Tuhan memberkatimu dan melindungimu; Kiranya Tuhan menyinari engkau dengan wajah-Nya. (Bilangan 6:24-25)",
            "Sebab Aku ini mengetahui rancangan-rancangan apa yang ada pada-Ku mengenai kamu, yaitu rancangan damai sejahtera. (Yeremia 29:11)",
            "Semoga damai sejahtera Kristus memerintah dalam hatimu. Selamat Ulang Tahun!",
            "Kiranya Ia memberikan kepadamu apa yang dikehendaki hatimu dan membuat berhasil segala rancanganmu. (Mazmur 20:4)",
            "Mengucap syukurlah dalam segala hal, sebab itulah yang dikehendaki Allah di dalam Kristus Yesus bagi kamu. (1 Tesalonika 5:18)",
            "Tuhan adalah gembalaku, takkan kekurangan aku. Selamat ulang tahun, kiranya penyertaan Tuhan selalu bersamamu. (Mazmur 23:1)",
            "Jadilah kuat dan teguh hatimu, janganlah takut dan janganlah tawar hati, sebab Tuhan, Allahmu, menyertai engkau. (Yosua 1:9)",
            "Tangan Tuhan yang kuat akan selalu menopangmu di usia yang baru ini. Selamat Ulang Tahun!"
        ];

        // --- DATE HELPERS (STRICT DD/MM/YYYY) ---
        const parseDateObj = (dateInput) => {
            if (!dateInput) return null;
            
            if (typeof dateInput === 'string') {
                const clean = dateInput.trim();
                const isOnlyDateChars = /^[0-9\/\-]+$/.test(clean);
                
                if (isOnlyDateChars) {
                    const separator = clean.includes('/') ? '/' : (clean.includes('-') ? '-' : null);
                    if (separator) {
                        const parts = clean.split(separator);
                        if (parts.length === 3) {
                            if (parts[0].length === 4) { 
                                // Jika format YYYY/MM/DD
                                return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                            } else { 
                                // Jika format DD/MM/YYYY (Tanggal/Bulan/Tahun)
                                return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
                            }
                        }
                    }
                }
            }
            
            // Fallback untuk tanggal panjang asli dari Javascript
            const d = new Date(dateInput);
            if (!isNaN(d.getTime())) return d;
            return null;
        };

        const formatToNumericDate = (dateInput) => {
            const d = parseDateObj(dateInput);
            if (!d) return dateInput || '-'; 
            
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        };

        // --- COMPONENTS ---

        const PremiumCardPreview = ({ people, quote, logoUrl }) => {
            const cardDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();

            return (
                <div className="w-full md:max-w-md mx-auto group">
                    <div id="card-capture-area" className="relative overflow-hidden rounded-[2rem] shadow-2xl flex flex-col bg-primary-950 border-[8px] md:border-[12px] border-white z-10 ring-1 ring-slate-200 min-h-[480px]">
                        
                        {/* Background Design */}
                        <div className="absolute inset-0 z-0 bg-gradient-to-br from-primary-900 to-primary-950">
                            <div className="absolute inset-0 opacity-20 card-texture"></div>
                            {/* Glow effects */}
                            <div className="absolute -top-20 -right-20 w-64 h-64 bg-accent-600 rounded-full blur-[90px] opacity-30"></div>
                            <div className="absolute -bottom-20 -left-20 w-64 h-64 bg-primary-500 rounded-full blur-[90px] opacity-30"></div>
                        </div>

                        {/* Content Container */}
                        <div className="relative z-10 flex flex-col justify-between h-full w-full p-6 md:p-8">
                            
                            {/* Header */}
                            <div className="flex flex-col items-center text-center mt-2">
                                <div className="mb-4 bg-primary-800 p-2.5 rounded-2xl shadow-xl flex items-center justify-center min-h-[3.5rem] min-w-[3.5rem] border-2 border-primary-500">
                                    <img 
                                        src={logoUrl || LINK_LOGO_DEFAULT} 
                                        alt="Logo" 
                                        crossOrigin="anonymous" 
                                        className="h-8 w-auto object-contain drop-shadow-sm"
                                        onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_LOGO; }}
                                    />
                                </div>
                                <h3 className="text-[9px] md:text-[10px] font-extrabold uppercase tracking-widest text-white mb-1.5 drop-shadow-sm px-2 leading-tight">
                                    Keluarga Besar Abbalove Ministries Bali Mengucapkan
                                </h3>
                                <h2 className="font-serif italic text-3xl md:text-4xl text-white mb-2 font-bold tracking-wide drop-shadow-md leading-none">
                                    Selamat Ulang Tahun
                                </h2>
                                <div className="w-12 h-1 bg-gradient-to-r from-transparent via-accent-500 to-transparent mb-2 rounded-full"></div>
                                <p className="text-[10px] md:text-xs font-bold text-accent-400 uppercase tracking-widest">
                                    Kepada:
                                </p>
                            </div>

                            {/* Names Section */}
                            <div className="flex-grow flex flex-col items-center justify-center py-5 text-center w-full">
                                <div className="w-full">
                                    {people.length > 1 ? (
                                        <div className="inline-block text-left space-y-3 bg-white/10 px-5 py-4 rounded-2xl border border-white/20 backdrop-blur-sm max-w-[100%] md:max-w-[95%]">
                                            {people.map((p, idx) => (
                                                <div key={idx} className="text-white flex items-start gap-2.5">
                                                    <span className="font-bold text-accent-400 text-sm md:text-lg">{idx + 1}.</span>
                                                    <div className="flex flex-col mt-0.5">
                                                        <span className="font-bold text-sm md:text-base uppercase tracking-wider leading-none">{p.nama}</span>
                                                        {p.area_ibadah && (
                                                            <span className="text-primary-200 text-[9px] md:text-[10px] uppercase tracking-widest mt-1.5">Area: {p.area_ibadah}</span>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        people.map((p, idx) => (
                                            <div key={idx} className="animate-slide-up flex flex-col items-center">
                                                <h1 className="text-2xl md:text-3xl font-extrabold text-white uppercase tracking-widest drop-shadow-lg leading-tight px-4">
                                                    {p.nama}
                                                </h1>
                                                {p.area_ibadah && (
                                                    <p className="text-primary-200 text-[10px] md:text-xs mt-2 uppercase tracking-widest font-medium">(Area: {p.area_ibadah})</p>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* Footer / Tanggal, Quote & Berkat */}
                            <div className="flex flex-col items-center text-center mt-2">
                                <div className="mb-4 px-4 py-1.5 bg-primary-900/60 border border-primary-700/50 rounded-full shadow-inner">
                                    <p className="text-[9px] md:text-[10px] font-bold text-primary-100 uppercase tracking-widest">
                                        {cardDate}
                                    </p>
                                </div>
                                <p className="text-[10px] md:text-[11px] text-primary-50 italic font-light leading-relaxed mb-5 px-4 md:px-6 opacity-90">
                                    "{quote}"
                                </p>
                                <div className="bg-gradient-to-r from-accent-600 to-accent-500 text-white px-6 py-2.5 rounded-full text-[9px] md:text-[10px] font-bold uppercase tracking-[0.2em] shadow-lg shadow-accent-600/30 border border-accent-400/50">
                                    Tuhan Yesus Memberkati
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [apiUrl, setApiUrl] = useState(() => localStorage.getItem('birthday_apiUrl') || LINK_API_APPS_SCRIPT);
            const [logoUrl, setLogoUrl] = useState(() => localStorage.getItem('birthday_logoUrl') || LINK_LOGO_DEFAULT);
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(false);
            const [isSaving, setSaving] = useState(false);
            
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoginLoading, setLoginLoading] = useState(false);
            
            const [filterMonth, setFilterMonth] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            
            const [showUserModal, setShowUserModal] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [originalNama, setOriginalNama] = useState('');
            const [formData, setFormData] = useState({ nama: '', area_ibadah: '', tgl_lahir: '' });
            
            const [combinedCard, setCombinedCard] = useState(null);

            const todayFormatted = useMemo(() => {
                return new Date().toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
            }, []);

            const filteredUsers = useMemo(() => {
                return users.filter(user => {
                    let monthMatch = true;
                    if (filterMonth !== 'all') {
                        const d = parseDateObj(user.tgl_lahir);
                        monthMatch = d && (d.getMonth() + 1 === parseInt(filterMonth, 10));
                    }
                    let searchMatch = true;
                    if (searchQuery) {
                        const query = searchQuery.toLowerCase();
                        searchMatch = (user.nama || '').toLowerCase().includes(query) || (user.area_ibadah || '').toLowerCase().includes(query);
                    }
                    return monthMatch && searchMatch;
                });
            }, [users, filterMonth, searchQuery]);

            const syncToAppsScript = async (payload) => {
                if (!apiUrl) return { status: 'error', message: 'API tidak diset' };
                try {
                    const response = await fetch(apiUrl, { method: 'POST', body: JSON.stringify(payload) });
                    return await response.json();
                } catch (e) {
                    throw e;
                }
            };

            const fetchFromAppsScript = async (urlToFetch) => {
                const targetUrl = urlToFetch || apiUrl;
                if (!targetUrl) return;
                setLoading(true);
                try {
                    const response = await fetch(targetUrl);
                    const parsedData = await response.json(); 
                    if (Array.isArray(parsedData)) {
                        // AUTO-MAPPING: Sistem pintar yang membaca data dari Google Sheets
                        // apa pun nama Header (judul kolom) yang diatur di Google Sheets.
                        const normalizedUsers = parsedData.map(user => {
                            // Cari kunci (key) yang merepresentasikan data secara cerdas
                            const areaKey = Object.keys(user).find(k => k.toLowerCase().includes('area') || k.toLowerCase().includes('ibadah') || k.toLowerCase() === 'email');
                            const nameKey = Object.keys(user).find(k => k.toLowerCase().includes('nama'));
                            const dateKey = Object.keys(user).find(k => k.toLowerCase().includes('tgl') || k.toLowerCase().includes('tanggal') || k.toLowerCase().includes('lahir'));

                            return {
                                ...user,
                                nama: nameKey && user[nameKey] ? user[nameKey] : (user.nama || ''),
                                area_ibadah: areaKey && user[areaKey] ? user[areaKey] : (user.area_ibadah || ''),
                                tgl_lahir: dateKey && user[dateKey] ? user[dateKey] : (user.tgl_lahir || ''),
                            };
                        });
                        setUsers(normalizedUsers);
                    }
                } catch (error) {
                    console.error("Gagal menarik data:", error);
                } finally {
                    setLoading(false);
                }
            };

            const checkBirthdays = (currentUsers) => {
                const dataToCheck = currentUsers || users;
                const today = new Date();
                const currentDay = today.getDate();
                const currentMonth = today.getMonth() + 1;

                const birthdayPeople = dataToCheck.filter(user => {
                    const d = parseDateObj(user.tgl_lahir);
                    if (!d) return false;
                    return d.getMonth() + 1 === currentMonth && d.getDate() === currentDay;
                });

                if (birthdayPeople.length > 0) {
                    setCombinedCard({
                        people: birthdayPeople, 
                        quote: CHRISTIAN_QUOTES[Math.floor(Math.random() * CHRISTIAN_QUOTES.length)]
                    });
                } else {
                    setCombinedCard(null);
                }
            };

            useEffect(() => {
                fetchFromAppsScript();
            }, []);

            useEffect(() => {
                if (!loading) checkBirthdays();
            }, [users, loading]);

            const handleDownload = async () => {
                const element = document.getElementById('card-capture-area');
                if (!element) return;
                const btn = document.getElementById('download-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="animate-pulse">Memproses...</span>';
                try {
                    await new Promise(r => setTimeout(r, 300));
                    const canvas = await html2canvas(element, { scale: 3, useCORS: true, backgroundColor: null });
                    const link = document.createElement('a');
                    link.download = `BlessingCard-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } finally {
                    btn.innerHTML = originalText;
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginLoading(true);
                setLoginError('');
                try {
                    const result = await syncToAppsScript({ action: 'login', username, password });
                    if (result.status === 'success') {
                        setIsLoggedIn(true);
                        setShowLoginModal(false);
                        setUsername('');
                        setPassword('');
                    } else {
                        setLoginError('Username atau password salah.');
                    }
                } catch {
                    setLoginError('Gagal menghubungi server.');
                } finally {
                    setLoginLoading(false);
                }
            };

            const handleSaveUser = async (e) => {
                e.preventDefault();
                setSaving(true);
                
                const dateParts = formData.tgl_lahir.split('-');
                let formattedDate = formData.tgl_lahir;
                if(dateParts.length === 3) {
                    formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`; 
                }

                // Kirim semua variasi key agar diterima mulus oleh Apps Script backend
                const payloadData = { 
                    nama: formData.nama, 
                    area_ibadah: formData.area_ibadah, 
                    tgl_lahir: formattedDate,
                    
                    // Fallback Keys: Memastikan script menangkap data ini apapun headernya
                    'Area Ibadah': formData.area_ibadah,
                    'Tanggal Lahir': formattedDate,
                    'Nama': formData.nama,
                    email: formData.area_ibadah // Disisipkan jika Apps Script lama masih mewajibkan key "email"
                };

                try {
                    if (isEditing) {
                        // OriginalEmail disertakan karena Apps Script lama mungkin masih menjadikan email sebagai patokan pencarian baris
                        await syncToAppsScript({ action: 'edit', originalNama: originalNama, originalEmail: originalNama, data: payloadData });
                        
                        const updated = users.map(u => u.nama === originalNama ? payloadData : u);
                        setUsers(updated);
                    } else {
                        await syncToAppsScript({ action: 'add', data: payloadData });
                        setUsers([...users, payloadData]);
                    }
                    setShowUserModal(false);
                } catch (err) {
                    console.error(err);
                    alert("Gagal menyimpan data ke server.");
                } finally {
                    setSaving(false);
                }
            };

            const handleDeleteUser = async (user) => {
                if(confirm(`Hapus data ${user.nama}?`)) {
                    try {
                        await syncToAppsScript({ action: 'delete', nama: user.nama, email: user.area_ibadah });
                        setUsers(users.filter(u => u.nama !== user.nama));
                    } catch (e) {
                        alert("Gagal menghapus data.");
                    }
                }
            };

            const openEditModal = (user) => {
                const d = parseDateObj(user.tgl_lahir);
                let dateForInput = '';
                if (d) {
                    dateForInput = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                }
                
                setFormData({
                    nama: user.nama,
                    area_ibadah: user.area_ibadah || '',
                    tgl_lahir: dateForInput
                });
                setOriginalNama(user.nama);
                setIsEditing(true);
                setShowUserModal(true);
            };

            const NavButton = ({ id, label, icon: IconCmp }) => (
                <button 
                    onClick={() => setActiveTab(id)} 
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 ${activeTab === id ? 'bg-primary-600 text-white shadow-md' : 'text-slate-600 hover:bg-primary-50 hover:text-primary-700'}`}
                >
                    <IconCmp c="w-4 h-4" /> <span className="hidden sm:inline">{label}</span>
                </button>
            );

            return (
                <div className="min-h-screen pb-20 flex flex-col font-sans">
                    
                    {/* Floating Navbar */}
                    <nav className="sticky top-4 z-40 mx-4 md:mx-auto max-w-5xl glass-panel rounded-2xl shadow-sm border border-slate-200/60 px-4 py-3 flex justify-between items-center mb-8 animate-fade-in">
                        <div className="flex items-center gap-3">
                            <div className="bg-primary-700 p-1.5 rounded-xl border border-primary-600 shadow-sm">
                                <img src={logoUrl || LINK_LOGO_DEFAULT} className="w-8 h-8 object-contain" onError={e => { e.target.onerror = null; e.target.src = FALLBACK_LOGO; }}/>
                            </div>
                            <div className="flex flex-col">
                                <span className="font-bold text-primary-900 leading-tight">BlessingCard</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-1 md:gap-2">
                            <NavButton id="dashboard" label="Beranda" icon={Gift} />
                            {isLoggedIn && (
                                <>
                                    <NavButton id="database" label="Database" icon={Users} />
                                    <NavButton id="settings" label="Pengaturan" icon={Settings} />
                                    <div className="w-px h-6 bg-slate-200 mx-1"></div>
                                    <button onClick={() => setIsLoggedIn(false)} className="p-2.5 text-accent-600 hover:bg-accent-50 rounded-xl transition-colors" title="Keluar">
                                        <LogOut c="w-5 h-5" />
                                    </button>
                                </>
                            )}
                            {!isLoggedIn && (
                                <button onClick={() => setShowLoginModal(true)} className="ml-2 px-5 py-2.5 bg-accent-600 hover:bg-accent-700 text-white rounded-xl text-sm font-semibold transition-all shadow-md hover:shadow-lg">
                                    Admin Login
                                </button>
                            )}
                        </div>
                    </nav>

                    {/* MODALS */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-primary-950/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8 relative animate-slide-up border border-slate-100">
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 p-2 text-slate-400 hover:bg-slate-100 rounded-full transition-colors"><X c="w-5 h-5"/></button>
                                <div className="text-center mb-8">
                                    <div className="w-16 h-16 bg-primary-50 rounded-full flex items-center justify-center mx-auto mb-4 text-primary-600">
                                        <LogOut c="w-8 h-8" />
                                    </div>
                                    <h2 className="text-2xl font-bold text-primary-900">Admin Akses</h2>
                                </div>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <input type="text" value={username} onChange={e => setUsername(e.target.value)} placeholder="Username" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:outline-none transition-all" required />
                                    </div>
                                    <div>
                                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:outline-none transition-all" required />
                                    </div>
                                    {loginError && <p className="text-accent-600 text-sm text-center font-medium">{loginError}</p>}
                                    <button type="submit" disabled={isLoginLoading} className="w-full bg-primary-600 hover:bg-primary-700 text-white py-3 rounded-xl font-bold transition-all shadow-md mt-2">
                                        {isLoginLoading ? 'Memeriksa...' : 'Masuk'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showUserModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-primary-950/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 relative animate-slide-up">
                                <button onClick={() => setShowUserModal(false)} className="absolute top-4 right-4 p-2 text-slate-400 hover:bg-slate-100 rounded-full transition-colors"><X c="w-5 h-5"/></button>
                                <h2 className="text-2xl font-bold text-primary-900 mb-6 flex items-center gap-2">
                                    {isEditing ? <><Edit c="w-6 h-6 text-primary-600"/> Edit Data</> : <><Plus c="w-6 h-6 text-primary-600"/> Tambah Data</>}
                                </h2>
                                <form onSubmit={handleSaveUser} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                                        <input type="text" value={formData.nama} onChange={e => setFormData({...formData, nama: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:outline-none" required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-600 mb-1">Area Ibadah</label>
                                        <input type="text" value={formData.area_ibadah} onChange={e => setFormData({...formData, area_ibadah: e.target.value})} placeholder="Contoh: Pusat, Selatan, Utara" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:outline-none" required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-600 mb-1">Tanggal Lahir</label>
                                        <input type="date" value={formData.tgl_lahir} onChange={e => setFormData({...formData, tgl_lahir: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:outline-none" required />
                                    </div>
                                    <button type="submit" disabled={isSaving} className="w-full bg-primary-600 hover:bg-primary-700 text-white py-3.5 rounded-xl font-bold transition-all shadow-md mt-4">
                                        {isSaving ? 'Menyimpan...' : 'Simpan Data'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MAIN CONTENT AREA */}
                    <main className="max-w-5xl mx-auto px-4 w-full flex-grow">
                        
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 animate-fade-in">
                                
                                {/* Status Banner */}
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                    <div>
                                        <h1 className="text-2xl font-bold text-primary-900 mb-1">Shalom! Hari yang indah.</h1>
                                        <p className="text-slate-500 text-sm md:text-base font-medium">
                                            {loading ? (
                                                <span className="flex items-center gap-2"><RefreshCw c="w-4 h-4 spinner text-primary-600"/> Sinkronisasi data...</span>
                                            ) : (
                                                combinedCard ? `Terdapat ${combinedCard.people.length} jemaat yang berulang tahun hari ini.` : 'Tidak ada jemaat yang berulang tahun hari ini.'
                                            )}
                                        </p>
                                    </div>
                                    <div className="bg-primary-50 text-primary-700 px-4 py-2 rounded-xl font-semibold flex items-center gap-2 text-sm border border-primary-100 shadow-sm">
                                        <Calendar c="w-4 h-4" /> {todayFormatted}
                                    </div>
                                </div>

                                {combinedCard && !loading && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                        
                                        {/* Left: Card Preview */}
                                        <div className="lg:col-span-5 flex justify-center lg:sticky lg:top-24">
                                            <PremiumCardPreview people={combinedCard.people} quote={combinedCard.quote} logoUrl={logoUrl} />
                                        </div>
                                        
                                        {/* Right: Actions & List */}
                                        <div className="lg:col-span-7 space-y-6">
                                            {/* Download Action */}
                                            <div className="bg-gradient-to-br from-primary-800 to-primary-950 p-8 rounded-3xl text-white shadow-xl relative overflow-hidden group border border-primary-700">
                                                <div className="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-accent-500 opacity-20 rounded-full blur-3xl group-hover:scale-150 transition-transform duration-700"></div>
                                                <h3 className="text-2xl font-bold mb-2">Sebarkan Berkat</h3>
                                                <p className="text-primary-100 mb-6 font-medium text-sm">Unduh kartu ucapan yang telah digenerasi secara otomatis ini untuk dibagikan ke WhatsApp atau media sosial.</p>
                                                <button id="download-btn" onClick={handleDownload} className="w-full bg-accent-600 text-white hover:bg-accent-700 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-all shadow-lg active:scale-[0.98]">
                                                    <Download c="w-5 h-5" /> Unduh Kartu Ucapan
                                                </button>
                                            </div>

                                            {/* List List */}
                                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                                <h4 className="font-bold text-lg text-primary-900 mb-4 flex items-center gap-2">
                                                    <Gift c="w-5 h-5 text-accent-500" /> Daftar Ulang Tahun
                                                </h4>
                                                <div className="space-y-3">
                                                    {combinedCard.people.map((p, idx) => (
                                                        <div key={idx} className="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100 hover:border-primary-100 hover:shadow-md transition-all">
                                                            <div className="w-12 h-12 rounded-full bg-primary-100 text-primary-700 flex items-center justify-center font-bold text-lg flex-shrink-0">
                                                                {p.nama.charAt(0).toUpperCase()}
                                                            </div>
                                                            <div>
                                                                <p className="font-bold text-slate-800 text-lg">{p.nama}</p>
                                                                <p className="text-sm text-slate-500 mt-0.5">
                                                                    Area: <span className="font-semibold text-slate-600">{p.area_ibadah || '-'}</span>
                                                                </p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {!combinedCard && !loading && (
                                    <div className="text-center py-24 bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col items-center justify-center">
                                        <div className="w-20 h-20 bg-primary-50 rounded-full flex items-center justify-center mb-4">
                                            <Calendar c="w-10 h-10 text-primary-300" />
                                        </div>
                                        <h3 className="text-xl font-bold text-primary-900 mb-2">Belum Ada Ulang Tahun</h3>
                                        <p className="text-slate-500 font-medium">Berdasarkan database, tidak ada jemaat yang berulang tahun hari ini.</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'database' && isLoggedIn && (
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in flex flex-col min-h-[60vh]">
                                {/* Toolbar */}
                                <div className="p-6 border-b border-slate-100 bg-slate-50/50 flex flex-col md:flex-row gap-4 justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-primary-100 rounded-lg text-primary-700"><Users c="w-5 h-5"/></div>
                                        <h3 className="text-lg font-bold text-slate-800">Total Data: {filteredUsers.length}</h3>
                                    </div>
                                    <div className="flex flex-wrap gap-3 w-full md:w-auto">
                                        <div className="relative flex-grow md:flex-grow-0">
                                            <Search c="absolute left-3 top-3 w-4 h-4 text-slate-400" />
                                            <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Cari nama/area..." className="pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm w-full md:w-56 focus:ring-2 focus:ring-primary-500 focus:outline-none" />
                                        </div>
                                        <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-primary-500 focus:outline-none text-slate-700 cursor-pointer">
                                            <option value="all">Semua Bulan</option>
                                            {[...Array(12)].map((_, i) => <option key={i+1} value={i+1}>{new Date(0, i).toLocaleString('id-ID', {month: 'long'})}</option>)}
                                        </select>
                                        <button onClick={() => { setFormData({nama:'', area_ibadah:'', tgl_lahir:''}); setIsEditing(false); setShowUserModal(true); }} className="bg-primary-600 hover:bg-primary-700 text-white px-5 py-2.5 rounded-xl font-semibold flex items-center gap-2 transition-colors shadow-sm">
                                            <Plus c="w-4 h-4"/> Tambah
                                        </button>
                                    </div>
                                </div>
                                
                                {/* Table */}
                                <div className="overflow-x-auto flex-grow">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-slate-500 uppercase bg-white border-b border-slate-100">
                                            <tr>
                                                <th className="px-6 py-4 font-semibold">Nama Lengkap</th>
                                                <th className="px-6 py-4 font-semibold">Area Ibadah</th>
                                                <th className="px-6 py-4 font-semibold">Tgl Lahir</th>
                                                <th className="px-6 py-4 font-semibold text-center">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {filteredUsers.length === 0 ? (
                                                <tr>
                                                    <td colSpan="4" className="px-6 py-10 text-center text-slate-500">
                                                        Data tidak ditemukan.
                                                    </td>
                                                </tr>
                                            ) : (
                                                filteredUsers.map((user, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50/80 transition-colors group">
                                                        <td className="px-6 py-4 font-bold text-slate-800">{user.nama}</td>
                                                        <td className="px-6 py-4">
                                                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 font-medium text-xs border border-slate-200">
                                                                Area: {user.area_ibadah || '-'}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-4 text-primary-600 font-medium tracking-wide">{formatToNumericDate(user.tgl_lahir)}</td>
                                                        <td className="px-6 py-4">
                                                            <div className="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                <button onClick={() => openEditModal(user)} className="p-2 text-primary-600 bg-primary-50 hover:bg-primary-100 rounded-lg transition-colors" title="Edit">
                                                                    <Edit c="w-4 h-4"/>
                                                                </button>
                                                                <button onClick={() => handleDeleteUser(user)} className="p-2 text-accent-600 bg-accent-50 hover:bg-accent-100 rounded-lg transition-colors" title="Hapus">
                                                                    <Trash2 c="w-4 h-4"/>
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && isLoggedIn && (
                            <div className="max-w-2xl mx-auto space-y-6 animate-fade-in">
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                                    <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
                                        <Settings c="w-6 h-6 text-primary-600" />
                                        <h3 className="text-xl font-bold text-slate-800">Pengaturan Sistem</h3>
                                    </div>
                                    
                                    <div className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-2">Link Google Apps Script (API)</label>
                                            <input type="text" value={apiUrl} onChange={e => {setApiUrl(e.target.value); localStorage.setItem('birthday_apiUrl', e.target.value);}} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none" />
                                            <p className="mt-2 text-xs text-slate-500">URL Web App dari Google Apps Script untuk menghubungkan aplikasi dengan Google Sheets.</p>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-2">Logo Gereja (URL Gambar)</label>
                                            <div className="flex gap-4 items-start">
                                                <input type="text" value={logoUrl} onChange={e => {setLogoUrl(e.target.value); localStorage.setItem('birthday_logoUrl', e.target.value);}} className="flex-grow px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none" />
                                                <div className="w-16 h-16 bg-primary-800 rounded-xl border border-primary-600 flex items-center justify-center flex-shrink-0 p-2 shadow-sm">
                                                    <img src={logoUrl || LINK_LOGO_DEFAULT} className="max-h-full object-contain" onError={e => { e.target.onerror = null; e.target.src = FALLBACK_LOGO; }} />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="pt-4">
                                            <button onClick={() => fetchFromAppsScript()} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors">
                                                <RefreshCw c={`w-5 h-5 ${loading ? 'spinner text-primary-600' : ''}`}/> Sinkronkan Ulang Database
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
