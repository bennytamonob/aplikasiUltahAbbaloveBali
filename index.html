<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlessingCard - Abbalove Ministries</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/YFNydDhq/logo.png">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2canvas -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'], // Font modern, bersih, elegan
                        serif: ['"Playfair Display"', 'serif'],     // Font klasik elegan untuk ucapan
                    },
                    colors: {
                        primary: { // Deep Slate/Navy untuk kesan Premium & Modern
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        accent: { // Soft Gold / Champagne untuk aksen elegan
                            50: '#fdfaf5',
                            100: '#fbf4e6',
                            200: '#f5e4c7',
                            300: '#eed0a0',
                            400: '#e4b671',
                            500: '#dca34f',
                            600: '#c6853a',
                            700: '#a56533',
                            800: '#85512f',
                            900: '#6c4329',
                            950: '#3d2214',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'card': '0 20px 40px -5px rgba(2, 6, 23, 0.2), 0 10px 15px -5px rgba(2, 6, 23, 0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #fcfcfd;
            background-image: 
                radial-gradient(at 0% 0%, hsla(210,100%,98%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(38,100%,96%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: #334155;
        }
        
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Premium Card Effects */
        .card-texture {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Custom Scrollbar Elegant */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Transition utility */
        .smooth-transition {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="antialiased selection:bg-accent-200 selection:text-primary-900">

    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo } = React;

        // --- KONFIGURASI UTAMA (TIDAK DIUBAH) ---
        const LINK_API_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxJsYbC3qlfzSdUJXMfjGTAJ6izeVdU7KPgpznKmGSCFVJfCvwqytewGwKLO1W9O09u/exec"; 
        const LINK_LOGO_DEFAULT = "https://i.ibb.co.com/YFNydDhq/logo.png"; 
        const FALLBACK_LOGO = "https://ui-avatars.com/api/?name=AM&background=0f172a&color=dca34f";
        // -------------------------

        // --- ICONS (Lucide Style) ---
        const Icon = ({ path, className = "w-5 h-5", fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );
        const Calendar = ({c}) => <Icon className={c} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></>} />;
        const Users = ({c}) => <Icon className={c} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></>} />;
        const RefreshCw = ({c}) => <Icon className={c} path={<><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></>} />;
        const Download = ({c}) => <Icon className={c} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></>} />;
        const MapPin = ({c}) => <Icon className={c} path={<><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></>} />;
        const LogOut = ({c}) => <Icon className={c} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></>} />;
        const X = ({c}) => <Icon className={c} path={<><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></>} />;
        const Plus = ({c}) => <Icon className={c} path={<><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></>} />;
        const Edit = ({c}) => <Icon className={c} path={<><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></>} />;
        const Trash2 = ({c}) => <Icon className={c} path={<><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></>} />;
        const Search = ({c}) => <Icon className={c} path={<><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></>} />;
        const Settings = ({c}) => <Icon className={c} path={<><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></>} />;
        const Gift = ({c}) => <Icon className={c} path={<><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></>} />;

        const CHRISTIAN_QUOTES = [
            "Kiranya Tuhan memberkatimu dan melindungimu; Kiranya Tuhan menyinari engkau dengan wajah-Nya. (Bilangan 6:24-25)",
            "Sebab Aku ini mengetahui rancangan-rancangan apa yang ada pada-Ku mengenai kamu, yaitu rancangan damai sejahtera. (Yeremia 29:11)",
            "Semoga damai sejahtera Kristus memerintah dalam hatimu. Selamat Ulang Tahun!",
            "Kiranya Ia memberikan kepadamu apa yang dikehendaki hatimu dan membuat berhasil segala rancanganmu. (Mazmur 20:4)",
            "Mengucap syukurlah dalam segala hal, sebab itulah yang dikehendaki Allah di dalam Kristus Yesus bagi kamu. (1 Tesalonika 5:18)",
            "Tuhan adalah gembalaku, takkan kekurangan aku. Selamat ulang tahun, kiranya penyertaan Tuhan selalu bersamamu. (Mazmur 23:1)",
            "Jadilah kuat dan teguh hatimu, janganlah takut dan janganlah tawar hati, sebab Tuhan, Allahmu, menyertai engkau. (Yosua 1:9)",
            "Tangan Tuhan yang kuat akan selalu menopangmu di usia yang baru ini. Selamat Ulang Tahun!"
        ];

        // --- DATE HELPERS (TIDAK DIUBAH) ---
        const parseDateObj = (dateInput) => {
            if (!dateInput) return null;
            
            if (typeof dateInput === 'string') {
                const clean = dateInput.trim();
                const isOnlyDateChars = /^[0-9\/\-]+$/.test(clean);
                
                if (isOnlyDateChars) {
                    const separator = clean.includes('/') ? '/' : (clean.includes('-') ? '-' : null);
                    if (separator) {
                        const parts = clean.split(separator);
                        if (parts.length === 3) {
                            if (parts[0].length === 4) { 
                                return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                            } else { 
                                return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
                            }
                        }
                    }
                }
            }
            const d = new Date(dateInput);
            if (!isNaN(d.getTime())) return d;
            return null;
        };

        const formatToNumericDate = (dateInput) => {
            const d = parseDateObj(dateInput);
            if (!d) return dateInput || '-'; 
            
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        };

        // --- COMPONENTS ---

        // UI BARU: Kartu yang lebih elegan seperti undangan premium
        const PremiumCardPreview = ({ people, quote, logoUrl }) => {
            const cardDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();

            return (
                <div className="w-full md:max-w-md mx-auto group perspective-1000">
                    <div id="card-capture-area" className="relative overflow-hidden shadow-card flex flex-col bg-primary-950 z-10 min-h-[500px] aspect-[4/5] rounded-none">
                        
                        {/* Background Design (Elegant Dark) */}
                        <div className="absolute inset-0 z-0 bg-primary-950">
                            <div className="absolute inset-0 card-texture"></div>
                            {/* Subtle Gold Glows */}
                            <div className="absolute -top-32 -right-32 w-80 h-80 bg-accent-600 rounded-full blur-[100px] opacity-20"></div>
                            <div className="absolute -bottom-32 -left-32 w-80 h-80 bg-accent-500 rounded-full blur-[100px] opacity-15"></div>
                        </div>

                        {/* Gold Border Outline */}
                        <div className="absolute inset-3 z-10 border border-accent-500/30"></div>
                        <div className="absolute inset-4 z-10 border border-accent-500/10"></div>

                        {/* Content Container */}
                        <div className="relative z-20 flex flex-col justify-between h-full w-full p-8 md:p-10">
                            
                            {/* Header */}
                            <div className="flex flex-col items-center text-center mt-4">
                                <div className="mb-6 flex items-center justify-center">
                                    <img 
                                        src={logoUrl || LINK_LOGO_DEFAULT} 
                                        alt="Logo" 
                                        crossOrigin="anonymous" 
                                        className="h-10 w-auto object-contain opacity-90 sepia-[.3] hue-rotate-[-10deg] saturate-[1.5]"
                                        onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_LOGO; }}
                                    />
                                </div>
                                <h3 className="text-[8px] md:text-[9px] font-semibold uppercase tracking-[0.3em] text-accent-300 mb-2 opacity-80">
                                    Keluarga Besar Abbalove Ministries Bali
                                </h3>
                                <h2 className="font-serif italic text-3xl md:text-4xl text-white mb-4 font-medium tracking-wide leading-none">
                                    Selamat Ulang Tahun
                                </h2>
                                <div className="w-10 h-[1px] bg-accent-500/50 mb-3"></div>
                                <p className="text-[9px] md:text-[10px] text-primary-300 uppercase tracking-widest font-medium">
                                    Dipersembahkan Kepada:
                                </p>
                            </div>

                            {/* Names Section */}
                            <div className="flex-grow flex flex-col items-center justify-center py-6 text-center w-full">
                                <div className="w-full px-2">
                                    {people.length > 1 ? (
                                        <div className="inline-block text-center space-y-4 max-w-full">
                                            {people.map((p, idx) => (
                                                <div key={idx} className="flex flex-col items-center justify-center">
                                                    <span className="font-serif text-lg md:text-xl text-accent-200 capitalize tracking-wide whitespace-normal break-words leading-tight">{p.nama}</span>
                                                    {p.area_ibadah && (
                                                        <span className="text-primary-400 text-[9px] md:text-[10px] uppercase tracking-[0.2em] mt-1 whitespace-normal break-words font-medium">Area {p.area_ibadah}</span>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        people.map((p, idx) => (
                                            <div key={idx} className="flex flex-col items-center">
                                                <h1 className="text-2xl md:text-3xl font-serif text-accent-200 capitalize tracking-wide leading-tight whitespace-normal break-words text-center">
                                                    {p.nama}
                                                </h1>
                                                {p.area_ibadah && (
                                                    <p className="text-primary-400 text-[10px] md:text-[11px] mt-2.5 uppercase tracking-[0.2em] font-medium whitespace-normal break-words text-center">Area {p.area_ibadah}</p>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* Footer / Tanggal, Quote & Berkat */}
                            <div className="flex flex-col items-center text-center mt-2">
                                <p className="text-[9px] md:text-[10px] font-medium text-accent-400/80 uppercase tracking-[0.2em] mb-4">
                                    {cardDate}
                                </p>
                                <p className="text-[10px] md:text-[11px] text-primary-200 font-serif italic leading-relaxed mb-6 px-2 opacity-80 whitespace-normal break-words">
                                    "{quote}"
                                </p>
                                <div className="text-[9px] md:text-[10px] text-white font-medium uppercase tracking-[0.3em] opacity-90 flex items-center gap-2">
                                    <span className="w-4 h-[1px] bg-accent-500/50"></span>
                                    Tuhan Yesus Memberkati
                                    <span className="w-4 h-[1px] bg-accent-500/50"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            // STATE TETAP SAMA
            const [activeTab, setActiveTab] = useState('dashboard');
            const [apiUrl, setApiUrl] = useState(() => localStorage.getItem('birthday_apiUrl') || LINK_API_APPS_SCRIPT);
            const [logoUrl, setLogoUrl] = useState(() => localStorage.getItem('birthday_logoUrl') || LINK_LOGO_DEFAULT);
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(false);
            const [isSaving, setSaving] = useState(false);
            
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoginLoading, setLoginLoading] = useState(false);
            
            const [filterMonth, setFilterMonth] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            
            const [showUserModal, setShowUserModal] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [originalNama, setOriginalNama] = useState('');
            const [formData, setFormData] = useState({ nama: '', area_ibadah: '', tgl_lahir: '' });
            
            const [combinedCard, setCombinedCard] = useState(null);

            const todayFormatted = useMemo(() => {
                return new Date().toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
            }, []);

            const filteredUsers = useMemo(() => {
                return users.filter(user => {
                    let monthMatch = true;
                    if (filterMonth !== 'all') {
                        const d = parseDateObj(user.tgl_lahir);
                        monthMatch = d && (d.getMonth() + 1 === parseInt(filterMonth, 10));
                    }
                    let searchMatch = true;
                    if (searchQuery) {
                        const query = searchQuery.toLowerCase();
                        searchMatch = (user.nama || '').toLowerCase().includes(query) || (user.area_ibadah || '').toLowerCase().includes(query);
                    }
                    return monthMatch && searchMatch;
                });
            }, [users, filterMonth, searchQuery]);

            // FUNGSI API TETAP SAMA
            const syncToAppsScript = async (payload) => {
                if (!apiUrl) return { status: 'error', message: 'API tidak diset' };
                try {
                    const response = await fetch(apiUrl, { method: 'POST', body: JSON.stringify(payload) });
                    return await response.json();
                } catch (e) {
                    throw e;
                }
            };

            const fetchFromAppsScript = async (urlToFetch) => {
                const targetUrl = urlToFetch || apiUrl;
                if (!targetUrl) return;
                setLoading(true);
                try {
                    const response = await fetch(targetUrl);
                    const parsedData = await response.json(); 
                    if (Array.isArray(parsedData)) {
                        const normalizedUsers = parsedData.map(user => {
                            const areaKey = Object.keys(user).find(k => k.toLowerCase().includes('area') || k.toLowerCase().includes('ibadah') || k.toLowerCase() === 'email');
                            const nameKey = Object.keys(user).find(k => k.toLowerCase().includes('nama'));
                            const dateKey = Object.keys(user).find(k => k.toLowerCase().includes('tgl') || k.toLowerCase().includes('tanggal') || k.toLowerCase().includes('lahir'));

                            return {
                                ...user,
                                nama: nameKey && user[nameKey] ? user[nameKey] : (user.nama || ''),
                                area_ibadah: areaKey && user[areaKey] ? user[areaKey] : (user.area_ibadah || ''),
                                tgl_lahir: dateKey && user[dateKey] ? user[dateKey] : (user.tgl_lahir || ''),
                            };
                        });
                        setUsers(normalizedUsers);
                    }
                } catch (error) {
                    console.error("Gagal menarik data:", error);
                } finally {
                    setLoading(false);
                }
            };

            const checkBirthdays = (currentUsers) => {
                const dataToCheck = currentUsers || users;
                const today = new Date();
                const currentDay = today.getDate();
                const currentMonth = today.getMonth() + 1;

                const birthdayPeople = dataToCheck.filter(user => {
                    const d = parseDateObj(user.tgl_lahir);
                    if (!d) return false;
                    return d.getMonth() + 1 === currentMonth && d.getDate() === currentDay;
                });

                if (birthdayPeople.length > 0) {
                    setCombinedCard({
                        people: birthdayPeople, 
                        quote: CHRISTIAN_QUOTES[Math.floor(Math.random() * CHRISTIAN_QUOTES.length)]
                    });
                } else {
                    setCombinedCard(null);
                }
            };

            const currentMonthIndex = new Date().getMonth() + 1;
            const currentMonthName = new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            
            const monthlyBirthdays = useMemo(() => {
                const thisMonthUsers = users.filter(user => {
                    const d = parseDateObj(user.tgl_lahir);
                    return d && (d.getMonth() + 1 === currentMonthIndex);
                });
                return thisMonthUsers.sort((a, b) => {
                    const dateA = parseDateObj(a.tgl_lahir).getDate();
                    const dateB = parseDateObj(b.tgl_lahir).getDate();
                    return dateA - dateB;
                });
            }, [users, currentMonthIndex]);

            useEffect(() => {
                fetchFromAppsScript();
            }, []);

            useEffect(() => {
                if (!loading) checkBirthdays();
            }, [users, loading]);

            const handleDownload = async () => {
                const element = document.getElementById('card-capture-area');
                if (!element) return;
                const btn = document.getElementById('download-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="animate-pulse">Memproses...</span>';
                try {
                    await new Promise(r => setTimeout(r, 300));
                    const canvas = await html2canvas(element, { scale: 3, useCORS: true, backgroundColor: '#020617' });
                    const link = document.createElement('a');
                    link.download = `BlessingCard-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } finally {
                    btn.innerHTML = originalText;
                }
            };

            const handleDownloadMonthly = async () => {
                const element = document.getElementById('monthly-capture-area');
                if (!element) return;
                const btn = document.getElementById('download-monthly-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="animate-pulse">Memproses...</span>';
                try {
                    await new Promise(r => setTimeout(r, 300));
                    const canvas = await html2canvas(element, { scale: 3, useCORS: true, backgroundColor: '#020617' });
                    const link = document.createElement('a');
                    link.download = `Ulang-Tahun-Bulan-${currentMonthName.split(' ')[0]}-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } finally {
                    btn.innerHTML = originalText;
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginLoading(true);
                setLoginError('');
                try {
                    const result = await syncToAppsScript({ action: 'login', username, password });
                    if (result.status === 'success') {
                        setIsLoggedIn(true);
                        setShowLoginModal(false);
                        setUsername('');
                        setPassword('');
                    } else {
                        setLoginError('Username atau password salah.');
                    }
                } catch {
                    setLoginError('Gagal menghubungi server.');
                } finally {
                    setLoginLoading(false);
                }
            };

            const handleSaveUser = async (e) => {
                e.preventDefault();
                setSaving(true);
                
                const dateParts = formData.tgl_lahir.split('-');
                let formattedDate = formData.tgl_lahir;
                if(dateParts.length === 3) {
                    formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`; 
                }

                const payloadData = { 
                    nama: formData.nama, 
                    area_ibadah: formData.area_ibadah, 
                    tgl_lahir: formattedDate,
                    'Area Ibadah': formData.area_ibadah,
                    'Tanggal Lahir': formattedDate,
                    'Nama': formData.nama,
                    email: formData.area_ibadah 
                };

                try {
                    if (isEditing) {
                        await syncToAppsScript({ action: 'edit', originalNama: originalNama, originalEmail: originalNama, data: payloadData });
                        const updated = users.map(u => u.nama === originalNama ? payloadData : u);
                        setUsers(updated);
                    } else {
                        await syncToAppsScript({ action: 'add', data: payloadData });
                        setUsers([...users, payloadData]);
                    }
                    setShowUserModal(false);
                } catch (err) {
                    console.error(err);
                    alert("Gagal menyimpan data ke server.");
                } finally {
                    setSaving(false);
                }
            };

            const handleDeleteUser = async (user) => {
                if(confirm(`Hapus data ${user.nama}?`)) {
                    try {
                        await syncToAppsScript({ action: 'delete', nama: user.nama, email: user.area_ibadah });
                        setUsers(users.filter(u => u.nama !== user.nama));
                    } catch (e) {
                        alert("Gagal menghapus data.");
                    }
                }
            };

            const openEditModal = (user) => {
                const d = parseDateObj(user.tgl_lahir);
                let dateForInput = '';
                if (d) {
                    dateForInput = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                }
                
                setFormData({
                    nama: user.nama,
                    area_ibadah: user.area_ibadah || '',
                    tgl_lahir: dateForInput
                });
                setOriginalNama(user.nama);
                setIsEditing(true);
                setShowUserModal(true);
            };

            const NavButton = ({ id, label, icon: IconCmp }) => (
                <button 
                    onClick={() => setActiveTab(id)} 
                    className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-semibold smooth-transition ${activeTab === id ? 'bg-primary-900 text-white shadow-md' : 'text-primary-600 hover:bg-primary-50 hover:text-primary-900'}`}
                >
                    <IconCmp c="w-4 h-4" /> <span className="hidden sm:inline">{label}</span>
                </button>
            );

            return (
                <div className="min-h-screen pb-20 flex flex-col">
                    
                    {/* UI BARU: Floating Navbar (Glass & Minimalist) */}
                    <nav className="sticky top-6 z-40 mx-4 md:mx-auto max-w-5xl glass-panel rounded-full shadow-soft px-3 py-3 flex justify-between items-center mb-10 animate-fade-in">
                        <div className="flex items-center gap-3 pl-2 md:pl-4">
                            <div className="bg-primary-900 p-2 rounded-full border border-primary-800 shadow-sm">
                                <img src={logoUrl || LINK_LOGO_DEFAULT} className="w-5 h-5 md:w-6 md:h-6 object-contain sepia-[.3] hue-rotate-[-10deg] saturate-[1.5]" onError={e => { e.target.onerror = null; e.target.src = FALLBACK_LOGO; }}/>
                            </div>
                            <span className="font-bold text-primary-900 tracking-tight hidden md:block">BlessingCard</span>
                        </div>
                        <div className="flex items-center gap-1 md:gap-2 pr-1">
                            <NavButton id="dashboard" label="Beranda" icon={Gift} />
                            {isLoggedIn && (
                                <>
                                    <NavButton id="database" label="Data" icon={Users} />
                                    <NavButton id="settings" label="Pengaturan" icon={Settings} />
                                    <div className="w-px h-6 bg-primary-200 mx-2"></div>
                                    <button onClick={() => setIsLoggedIn(false)} className="p-2.5 text-primary-400 hover:bg-red-50 hover:text-red-600 rounded-full smooth-transition" title="Keluar">
                                        <LogOut c="w-5 h-5" />
                                    </button>
                                </>
                            )}
                            {!isLoggedIn && (
                                <button onClick={() => setShowLoginModal(true)} className="ml-2 px-6 py-2.5 bg-primary-900 hover:bg-primary-950 text-white rounded-full text-sm font-semibold smooth-transition shadow-md hover:shadow-lg">
                                    Login Admin
                                </button>
                            )}
                        </div>
                    </nav>

                    {/* UI BARU: MODALS yang lebih bersih */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-primary-900/40 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-[2rem] shadow-card w-full max-w-sm p-8 md:p-10 relative animate-slide-up">
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-6 right-6 p-2 text-primary-300 hover:bg-primary-50 rounded-full smooth-transition"><X c="w-5 h-5"/></button>
                                <div className="text-center mb-8">
                                    <h2 className="text-2xl font-bold text-primary-900 tracking-tight">Akses Admin</h2>
                                    <p className="text-primary-500 text-sm mt-2">Masuk untuk mengelola data jemaat.</p>
                                </div>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <input type="text" value={username} onChange={e => setUsername(e.target.value)} placeholder="Username" className="w-full px-5 py-3.5 bg-primary-50/50 border border-primary-100 rounded-xl focus:border-accent-500 focus:ring-4 focus:ring-accent-500/10 focus:outline-none smooth-transition text-primary-900 font-medium placeholder:text-primary-300" required />
                                    </div>
                                    <div>
                                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" className="w-full px-5 py-3.5 bg-primary-50/50 border border-primary-100 rounded-xl focus:border-accent-500 focus:ring-4 focus:ring-accent-500/10 focus:outline-none smooth-transition text-primary-900 font-medium placeholder:text-primary-300" required />
                                    </div>
                                    {loginError && <p className="text-red-500 text-sm text-center font-medium bg-red-50 py-2 rounded-lg">{loginError}</p>}
                                    <button type="submit" disabled={isLoginLoading} className="w-full bg-primary-900 hover:bg-primary-950 text-white py-4 rounded-xl font-semibold smooth-transition shadow-md mt-6">
                                        {isLoginLoading ? 'Memeriksa...' : 'Masuk ke Dashboard'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showUserModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-primary-900/40 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-[2rem] shadow-card w-full max-w-md p-8 md:p-10 relative animate-slide-up">
                                <button onClick={() => setShowUserModal(false)} className="absolute top-6 right-6 p-2 text-primary-300 hover:bg-primary-50 rounded-full smooth-transition"><X c="w-5 h-5"/></button>
                                <h2 className="text-2xl font-bold text-primary-900 mb-8 tracking-tight">
                                    {isEditing ? 'Edit Data Jemaat' : 'Tambah Jemaat Baru'}
                                </h2>
                                <form onSubmit={handleSaveUser} className="space-y-5">
                                    <div>
                                        <label className="block text-xs font-bold text-primary-500 uppercase tracking-wide mb-2 ml-1">Nama Lengkap</label>
                                        <input type="text" value={formData.nama} onChange={e => setFormData({...formData, nama: e.target.value})} className="w-full px-5 py-3.5 bg-primary-50/50 border border-primary-100 rounded-xl focus:border-accent-500 focus:ring-4 focus:ring-accent-500/10 focus:outline-none smooth-transition text-primary-900 font-medium" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-primary-500 uppercase tracking-wide mb-2 ml-1">Area Ibadah</label>
                                        <input type="text" value={formData.area_ibadah} onChange={e => setFormData({...formData, area_ibadah: e.target.value})} placeholder="Contoh: Pusat, Selatan" className="w-full px-5 py-3.5 bg-primary-50/50 border border-primary-100 rounded-xl focus:border-accent-500 focus:ring-4 focus:ring-accent-500/10 focus:outline-none smooth-transition text-primary-900 font-medium" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-primary-500 uppercase tracking-wide mb-2 ml-1">Tanggal Lahir</label>
                                        <input type="date" value={formData.tgl_lahir} onChange={e => setFormData({...formData, tgl_lahir: e.target.value})} className="w-full px-5 py-3.5 bg-primary-50/50 border border-primary-100 rounded-xl focus:border-accent-500 focus:ring-4 focus:ring-accent-500/10 focus:outline-none smooth-transition text-primary-900 font-medium" required />
                                    </div>
                                    <button type="submit" disabled={isSaving} className="w-full bg-primary-900 hover:bg-primary-950 text-white py-4 rounded-xl font-semibold smooth-transition shadow-md mt-8">
                                        {isSaving ? 'Menyimpan...' : 'Simpan Data'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MAIN CONTENT AREA */}
                    <main className="max-w-5xl mx-auto px-4 w-full flex-grow">
                        
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-fade-in">
                                
                                {/* Status Header - Clean & Minimalist */}
                                <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 pb-4 border-b border-primary-200/50">
                                    <div>
                                        <h1 className="text-3xl font-bold text-primary-900 tracking-tight">Shalom!</h1>
                                        <p className="text-primary-500 font-medium mt-1">
                                            {loading ? (
                                                <span className="flex items-center gap-2"><RefreshCw c="w-4 h-4 spinner text-accent-500"/> Memuat data dari server...</span>
                                            ) : (
                                                combinedCard ? `Terdapat ${combinedCard.people.length} jemaat yang berulang tahun hari ini.` : 'Tidak ada jemaat yang berulang tahun hari ini.'
                                            )}
                                        </p>
                                    </div>
                                    <div className="bg-white text-primary-700 px-5 py-2.5 rounded-full font-semibold flex items-center gap-2.5 text-sm shadow-sm border border-primary-100">
                                        <Calendar c="w-4 h-4 text-accent-500" /> {todayFormatted}
                                    </div>
                                </div>

                                {combinedCard && !loading && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start mt-8">
                                        
                                        {/* Left: Card Preview */}
                                        <div className="lg:col-span-5 flex justify-center lg:sticky lg:top-32">
                                            <PremiumCardPreview people={combinedCard.people} quote={combinedCard.quote} logoUrl={logoUrl} />
                                        </div>
                                        
                                        {/* Right: Actions & List */}
                                        <div className="lg:col-span-7 space-y-8">
                                            
                                            {/* Download Action - Elegant Design */}
                                            <div className="bg-primary-900 p-8 md:p-10 rounded-[2rem] text-white shadow-card relative overflow-hidden group">
                                                <div className="absolute top-0 right-0 -mt-10 -mr-10 w-48 h-48 bg-accent-500 opacity-10 rounded-full blur-3xl group-hover:scale-150 smooth-transition duration-700"></div>
                                                <h3 className="text-2xl font-serif text-accent-200 mb-3 tracking-wide">Sebarkan Berkat</h3>
                                                <p className="text-primary-300 mb-8 font-medium leading-relaxed">Unduh kartu ucapan premium ini dan bagikan sukacita kepada mereka yang berulang tahun hari ini.</p>
                                                <button id="download-btn" onClick={handleDownload} className="w-full bg-accent-500 text-primary-950 hover:bg-accent-400 font-bold py-4 rounded-xl flex items-center justify-center gap-2 smooth-transition shadow-[0_10px_20px_-10px_rgba(220,163,79,0.5)] hover:-translate-y-0.5">
                                                    <Download c="w-5 h-5" /> Unduh Kartu Ucapan
                                                </button>
                                            </div>

                                            {/* List Jemaat - Clean lines */}
                                            <div>
                                                <h4 className="font-bold text-sm text-primary-400 uppercase tracking-widest mb-4 flex items-center gap-2 px-2">
                                                    <Gift c="w-4 h-4" /> Daftar Ulang Tahun Hari Ini
                                                </h4>
                                                <div className="space-y-3">
                                                    {combinedCard.people.map((p, idx) => (
                                                        <div key={idx} className="flex items-center gap-5 bg-white p-4 md:p-5 rounded-2xl border border-primary-100 shadow-sm hover:shadow-md smooth-transition hover:border-accent-200">
                                                            <div className="w-12 h-12 rounded-full bg-primary-50 text-accent-600 flex items-center justify-center font-serif font-bold text-xl flex-shrink-0 border border-primary-100">
                                                                {p.nama.charAt(0).toUpperCase()}
                                                            </div>
                                                            <div>
                                                                <p className="font-bold text-primary-900 text-lg tracking-tight">{p.nama}</p>
                                                                <p className="text-sm text-primary-500 mt-0.5">
                                                                    Area: <span className="font-semibold text-primary-700">{p.area_ibadah || '-'}</span>
                                                                </p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {!combinedCard && !loading && (
                                    <div className="text-center py-32 flex flex-col items-center justify-center">
                                        <div className="w-20 h-20 bg-primary-50 rounded-full flex items-center justify-center mb-6 shadow-sm border border-primary-100">
                                            <Calendar c="w-8 h-8 text-primary-300" />
                                        </div>
                                        <h3 className="text-2xl font-bold text-primary-900 mb-2 tracking-tight">Tidak Ada Ulang Tahun</h3>
                                        <p className="text-primary-500 font-medium">Belum ada jadwal perayaan ulang tahun jemaat untuk hari ini.</p>
                                    </div>
                                )}

                                {/* --- POSTER ULANG TAHUN BULANAN (ELEGANT) --- */}
                                <div className="mt-16 pt-16 border-t border-primary-200/60 animate-fade-in pb-10">
                                    <div className="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
                                        <div className="text-center md:text-left">
                                            <h2 className="text-3xl font-bold text-primary-900 tracking-tight">Daftar Bulan {currentMonthName.split(' ')[0]}</h2>
                                            <p className="text-primary-500 font-medium mt-2">Seluruh jemaat yang berulang tahun di bulan ini.</p>
                                        </div>
                                        {monthlyBirthdays.length > 0 && (
                                            <button id="download-monthly-btn" onClick={handleDownloadMonthly} className="bg-white border border-primary-200 text-primary-800 hover:text-primary-900 hover:border-primary-300 font-semibold py-3 px-6 rounded-xl flex items-center gap-2 smooth-transition shadow-sm w-full md:w-auto justify-center hover:bg-primary-50">
                                                <Download c="w-5 h-5" /> Unduh Rekap Bulanan
                                            </button>
                                        )}
                                    </div>

                                    {monthlyBirthdays.length > 0 ? (
                                        <div className="w-full mx-auto group">
                                            <div id="monthly-capture-area" className="relative overflow-hidden flex flex-col bg-primary-950 shadow-card z-10 p-10 md:p-14 min-h-[500px] rounded-none">
                                                
                                                {/* Background Design */}
                                                <div className="absolute inset-0 z-0 bg-primary-950">
                                                    <div className="absolute inset-0 card-texture opacity-50"></div>
                                                    <div className="absolute top-0 right-0 w-96 h-96 bg-accent-600 rounded-full blur-[120px] opacity-10"></div>
                                                    <div className="absolute bottom-0 left-0 w-96 h-96 bg-accent-500 rounded-full blur-[120px] opacity-10"></div>
                                                </div>

                                                {/* Gold Border */}
                                                <div className="absolute inset-4 z-10 border border-accent-500/20"></div>

                                                <div className="relative z-20 w-full flex flex-col items-center">
                                                    {/* Header */}
                                                    <div className="flex flex-col items-center text-center mb-12">
                                                        <div className="mb-6 flex items-center justify-center">
                                                            <img src={logoUrl || LINK_LOGO_DEFAULT} alt="Logo" crossOrigin="anonymous" className="h-10 w-auto object-contain opacity-90 sepia-[.3] hue-rotate-[-10deg] saturate-[1.5]" onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_LOGO; }} />
                                                        </div>
                                                        <h3 className="text-[8px] md:text-[9px] font-semibold uppercase tracking-[0.3em] text-accent-300 mb-2 opacity-80">
                                                            Keluarga Besar Abbalove
                                                        </h3>
                                                        <h2 className="font-serif italic text-3xl md:text-5xl text-white mb-4 font-medium tracking-wide">
                                                            Ulang Tahun Bulan {currentMonthName.split(' ')[0]}
                                                        </h2>
                                                        <div className="w-12 h-[1px] bg-accent-500/50"></div>
                                                    </div>

                                                    {/* List Grid - Clean Minimalist */}
                                                    <div className="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-y-6 gap-x-10 mb-12">
                                                        {monthlyBirthdays.map((p, idx) => {
                                                            const d = parseDateObj(p.tgl_lahir);
                                                            const day = d ? String(d.getDate()).padStart(2, '0') : '-';
                                                            return (
                                                                <div key={idx} className="flex items-center gap-4 pb-4 border-b border-primary-800/50">
                                                                    <div className="text-accent-400 font-serif font-bold text-3xl flex-shrink-0 w-10 text-center opacity-90">
                                                                        {day}
                                                                    </div>
                                                                    <div className="flex flex-col flex-1 min-w-0 pt-1">
                                                                        <span className="text-white font-medium text-sm uppercase tracking-wide leading-tight mb-1 whitespace-normal break-words">{p.nama}</span>
                                                                        {p.area_ibadah && (
                                                                            <span className="text-primary-400 text-[10px] uppercase tracking-widest whitespace-normal break-words font-medium">Area {p.area_ibadah}</span>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    <div className="text-[9px] md:text-[10px] text-white font-medium uppercase tracking-[0.3em] opacity-80 flex items-center gap-2 mt-auto">
                                                        Tuhan Yesus Memberkati
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-20 bg-white rounded-3xl border border-primary-100 shadow-sm">
                                            <p className="text-primary-500 font-medium">Tidak ada data jemaat yang berulang tahun di bulan ini.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'database' && isLoggedIn && (
                            <div className="bg-white rounded-[2rem] shadow-soft border border-primary-100 overflow-hidden animate-fade-in flex flex-col min-h-[60vh]">
                                {/* Toolbar */}
                                <div className="p-6 md:p-8 border-b border-primary-100 flex flex-col lg:flex-row gap-6 justify-between items-start lg:items-center">
                                    <div>
                                        <h3 className="text-2xl font-bold text-primary-900 tracking-tight">Data Jemaat</h3>
                                        <p className="text-primary-500 text-sm mt-1">Total {filteredUsers.length} data tersimpan</p>
                                    </div>
                                    <div className="flex flex-wrap gap-3 w-full lg:w-auto">
                                        <div className="relative flex-grow lg:flex-grow-0">
                                            <Search c="absolute left-4 top-3.5 w-4 h-4 text-primary-400" />
                                            <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Cari nama/area..." className="pl-11 pr-4 py-3 bg-primary-50/50 border border-primary-200 rounded-xl text-sm w-full lg:w-64 focus:ring-4 focus:ring-primary-500/10 focus:border-primary-400 focus:outline-none smooth-transition text-primary-900 font-medium" />
                                        </div>
                                        <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="px-5 py-3 bg-primary-50/50 border border-primary-200 rounded-xl text-sm font-medium focus:ring-4 focus:ring-primary-500/10 focus:border-primary-400 focus:outline-none text-primary-800 cursor-pointer smooth-transition">
                                            <option value="all">Semua Bulan</option>
                                            {[...Array(12)].map((_, i) => <option key={i+1} value={i+1}>{new Date(0, i).toLocaleString('id-ID', {month: 'long'})}</option>)}
                                        </select>
                                        <button onClick={() => { setFormData({nama:'', area_ibadah:'', tgl_lahir:''}); setIsEditing(false); setShowUserModal(true); }} className="bg-primary-900 hover:bg-primary-950 text-white px-6 py-3 rounded-xl font-semibold flex items-center gap-2 smooth-transition shadow-md hover:shadow-lg">
                                            <Plus c="w-4 h-4"/> Tambah Data
                                        </button>
                                    </div>
                                </div>
                                
                                {/* Table Elegant */}
                                <div className="overflow-x-auto flex-grow">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-[11px] text-primary-400 uppercase tracking-wider bg-white border-b border-primary-100 font-bold">
                                            <tr>
                                                <th className="px-8 py-5">Nama Lengkap</th>
                                                <th className="px-8 py-5">Area Ibadah</th>
                                                <th className="px-8 py-5">Tanggal Lahir</th>
                                                <th className="px-8 py-5 text-right">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-primary-50">
                                            {filteredUsers.length === 0 ? (
                                                <tr>
                                                    <td colSpan="4" className="px-8 py-16 text-center text-primary-400 font-medium">
                                                        Data tidak ditemukan dalam database.
                                                    </td>
                                                </tr>
                                            ) : (
                                                filteredUsers.map((user, idx) => (
                                                    <tr key={idx} className="hover:bg-primary-50/50 smooth-transition group">
                                                        <td className="px-8 py-5 font-bold text-primary-900 tracking-tight">{user.nama}</td>
                                                        <td className="px-8 py-5">
                                                            <span className="inline-flex items-center text-primary-600 font-medium text-sm">
                                                                {user.area_ibadah || '-'}
                                                            </span>
                                                        </td>
                                                        <td className="px-8 py-5 text-primary-500 font-medium">{formatToNumericDate(user.tgl_lahir)}</td>
                                                        <td className="px-8 py-5">
                                                            <div className="flex justify-end gap-2 opacity-0 group-hover:opacity-100 smooth-transition">
                                                                <button onClick={() => openEditModal(user)} className="p-2.5 text-primary-500 bg-white border border-primary-200 hover:text-primary-900 hover:border-primary-400 rounded-lg smooth-transition shadow-sm" title="Edit">
                                                                    <Edit c="w-4 h-4"/>
                                                                </button>
                                                                <button onClick={() => handleDeleteUser(user)} className="p-2.5 text-red-500 bg-white border border-primary-200 hover:text-red-700 hover:border-red-300 hover:bg-red-50 rounded-lg smooth-transition shadow-sm" title="Hapus">
                                                                    <Trash2 c="w-4 h-4"/>
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && isLoggedIn && (
                            <div className="max-w-2xl mx-auto animate-fade-in">
                                <div className="bg-white p-8 md:p-10 rounded-[2rem] shadow-soft border border-primary-100">
                                    <div className="flex items-center gap-3 mb-8 pb-5 border-b border-primary-100">
                                        <div className="p-2 bg-primary-50 rounded-lg text-primary-800">
                                            <Settings c="w-6 h-6" />
                                        </div>
                                        <h3 className="text-2xl font-bold text-primary-900 tracking-tight">Pengaturan Sistem</h3>
                                    </div>
                                    
                                    <div className="space-y-8">
                                        <div>
                                            <label className="block text-xs font-bold text-primary-500 uppercase tracking-wide mb-2 ml-1">Link Google Apps Script (API)</label>
                                            <input type="text" value={apiUrl} onChange={e => {setApiUrl(e.target.value); localStorage.setItem('birthday_apiUrl', e.target.value);}} className="w-full px-5 py-3.5 bg-primary-50/50 border border-primary-200 rounded-xl text-sm focus:ring-4 focus:ring-primary-500/10 focus:border-primary-400 focus:outline-none smooth-transition text-primary-800 font-medium" />
                                            <p className="mt-2 text-xs text-primary-400 font-medium">URL Web App dari Google Apps Script untuk menghubungkan aplikasi dengan Google Sheets.</p>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-xs font-bold text-primary-500 uppercase tracking-wide mb-2 ml-1">Logo Gereja (URL Gambar)</label>
                                            <div className="flex gap-4 items-start">
                                                <input type="text" value={logoUrl} onChange={e => {setLogoUrl(e.target.value); localStorage.setItem('birthday_logoUrl', e.target.value);}} className="flex-grow px-5 py-3.5 bg-primary-50/50 border border-primary-200 rounded-xl text-sm focus:ring-4 focus:ring-primary-500/10 focus:border-primary-400 focus:outline-none smooth-transition text-primary-800 font-medium" />
                                                <div className="w-16 h-16 bg-primary-950 rounded-xl border border-primary-800 flex items-center justify-center flex-shrink-0 p-2 shadow-inner">
                                                    <img src={logoUrl || LINK_LOGO_DEFAULT} className="max-h-full object-contain sepia-[.3] hue-rotate-[-10deg] saturate-[1.5]" onError={e => { e.target.onerror = null; e.target.src = FALLBACK_LOGO; }} />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="pt-6 border-t border-primary-100">
                                            <button onClick={() => fetchFromAppsScript()} className="w-full bg-white border border-primary-200 hover:border-primary-400 hover:bg-primary-50 text-primary-800 py-4 rounded-xl font-bold flex items-center justify-center gap-2 smooth-transition shadow-sm">
                                                <RefreshCw c={`w-5 h-5 ${loading ? 'spinner text-accent-500' : ''}`}/> Sinkronkan Ulang Database
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
